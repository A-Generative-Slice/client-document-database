<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Generative Slice — Document Dashboard</title>
    <link rel="stylesheet" href="design-system/dashboard.css">
</head>
<body>
    <header class="app-header">
        <div class="brand-bundle">
            <div class="brand-logo">A Generative Slice</div>
            <div style="font-size: 14px; opacity: 0.8; margin-left: 20px;">Document Central v1.0</div>
        </div>
        <div class="header-actions">
            <span id="sync-status" style="font-size: 12px; margin-right: 15px; opacity: 0.6;"></span>
            <button class="btn btn-primary" onclick="window.location.reload()">Refresh Data</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="search-container">
                <input type="text" id="client-search" class="search-input" placeholder="Search clients or docs...">
            </div>
            <div class="client-list" id="client-list">
                <!-- Clients will be injected here -->
            </div>
        </aside>

        <main class="content-area">
            <div id="welcome-screen" style="text-align: center; margin-top: 100px;">
                <h1 style="color: var(--text-primary); margin-bottom: 20px;">Welcome to your Document Database</h1>
                <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto;">Select a client from the sidebar to view their generated invoices, agreements, and certificates.</p>
            </div>
            <div class="doc-grid" id="doc-grid">
                <!-- Documents will be injected here -->
            </div>
        </main>
    </div>

    <!-- PREVIEW OVERLAY -->
    <div class="preview-overlay" id="preview-overlay">
        <div class="preview-content">
            <div class="preview-header">
                <h3 id="preview-title">Document Preview</h3>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" id="btn-open-new">Open in New Tab</button>
                    <button class="btn btn-close" onclick="closePreview()">Close</button>
                </div>
            </div>
            <iframe id="preview-frame" class="preview-frame"></iframe>
        </div>
    </div>

    <script>
        /* DATA_START */
        const DOC_DATA = {
  "nas-design-construction": {
    "name": "Nas Design Construction",
    "documents": [
      {
        "title": "Project Acceptance & Sign-Off Certificate",
        "id": "CERT-2026-001",
        "date": "2026-04-09 15:04",
        "path": "clients/nas-design-construction/generated/Signoff_Certificate_CERT-2026-001.html",
        "filename": "Signoff_Certificate_CERT-2026-001.html"
      },
      {
        "title": "Website Maintenance & Management Agreement",
        "id": "MAINT-2026-NAS01",
        "date": "2026-04-09 15:04",
        "path": "clients/nas-design-construction/generated/Maintenance_Agreement_MAINT-2026-NAS01.html",
        "filename": "Maintenance_Agreement_MAINT-2026-NAS01.html"
      },
      {
        "title": "Invoice INV-1001",
        "id": "INV-1001",
        "date": "2026-04-09 15:04",
        "path": "clients/nas-design-construction/generated/Invoice_INV-1001.html",
        "filename": "Invoice_INV-1001.html"
      }
    ]
  }
};
        /* DATA_END */

        const clientListEl = document.getElementById('client-list');
        const docGridEl = document.getElementById('doc-grid');
        const searchInput = document.getElementById('client-search');
        const welcomeScreen = document.getElementById('welcome-screen');
        const syncStatus = document.getElementById('sync-status');

        let activeClient = null;

        function init() {
            renderClientList();
            
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                renderClientList(term);
            });

            // Show last sync time
            syncStatus.innerText = "Last Indexed: " + new Date().toLocaleString();
        }

        function renderClientList(filterTerm = '') {
            clientListEl.innerHTML = '';
            
            Object.keys(DOC_DATA).forEach(key => {
                const client = DOC_DATA[key];
                if (client.name.toLowerCase().includes(filterTerm) || 
                    client.documents.some(d => d.title.toLowerCase().includes(filterTerm))) {
                    
                    const el = document.createElement('div');
                    el.className = `client-item ${activeClient === key ? 'active' : ''}`;
                    el.innerHTML = `
                        <span>${client.name}</span>
                        <span class="doc-count">${client.documents.length}</span>
                    `;
                    el.onclick = () => selectClient(key);
                    clientListEl.appendChild(el);
                }
            });
        }

        function selectClient(key) {
            activeClient = key;
            welcomeScreen.style.display = 'none';
            renderClientList(searchInput.value.toLowerCase()); // Update active state in sidebar
            
            const client = DOC_DATA[key];
            docGridEl.innerHTML = '';
            
            client.documents.forEach(doc => {
                const card = document.createElement('div');
                card.className = 'doc-card';
                
                // Determine icon based on title
                let icon = '📄';
                if (doc.title.toLowerCase().includes('invoice')) icon = '💳';
                if (doc.title.toLowerCase().includes('agreement')) icon = '🤝';
                if (doc.title.toLowerCase().includes('certificate')) icon = '🏆';

                card.innerHTML = `
                    <div class="doc-type-icon">${icon}</div>
                    <h3>${doc.title}</h3>
                    <div class="meta">
                        <div>ID: ${doc.id}</div>
                        <div>Generated: ${doc.date}</div>
                    </div>
                `;
                card.onclick = () => openPreview(doc);
                docGridEl.appendChild(card);
            });
        }

        function openPreview(doc) {
            const overlay = document.getElementById('preview-overlay');
            const frame = document.getElementById('preview-frame');
            const title = document.getElementById('preview-title');
            const openBtn = document.getElementById('btn-open-new');

            title.innerText = doc.title + " (" + doc.id + ")";
            frame.src = doc.path;
            openBtn.onclick = () => window.open(doc.path, '_blank');
            
            overlay.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closePreview() {
            document.getElementById('preview-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('preview-frame').src = '';
        }

        init();
    </script>
</body>
</html>
