<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Central — A Generative Slice</title>
    <meta name="description" content="Professional client document database for A Generative Slice. View, manage, and print invoices, agreements, and certificates.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════
           DOCUMENT CENTRAL — Light Professional Theme
           Matches the orange brand of A Generative Slice
           ═══════════════════════════════════════════ */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --brand: #FF8C1A;
            --brand-dark: #D97008;
            --brand-light: #FFF3E6;
            --brand-lighter: #FFF9F2;
            --text: #2C3E50;
            --text-secondary: #5A6A7A;
            --text-muted: #8A95A5;
            --bg: #FAFBFC;
            --bg-white: #FFFFFF;
            --border: #E8ECF0;
            --border-light: #F0F2F5;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
            --radius: 10px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .navbar {
            background: var(--bg-white);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text);
            cursor: pointer;
        }

        .navbar-logo {
            font-size: 20px;
            font-weight: 700;
            font-style: italic;
            color: var(--brand);
        }

        .navbar-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
        }

        .navbar-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .navbar-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ── BREADCRUMB ── */
        .breadcrumb {
            background: var(--bg-white);
            border-bottom: 1px solid var(--border-light);
            padding: 10px 32px;
            font-size: 13px;
            color: var(--text-muted);
            display: none;
        }

        .breadcrumb.visible { display: block; }

        .breadcrumb a {
            color: var(--brand);
            text-decoration: none;
            cursor: pointer;
        }

        .breadcrumb a:hover { text-decoration: underline; }

        .breadcrumb span { color: var(--text-secondary); font-weight: 500; }

        /* ── MAIN CONTENT ── */
        .main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        /* ── HOME PAGE ── */
        .page { display: none; }
        .page.active { display: block; }

        .home-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .home-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .home-header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 24px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--brand);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ── CLIENT CARDS ── */
        .section-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 16px;
            padding-left: 4px;
        }

        .client-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 16px;
        }

        .client-card {
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: flex-start;
            gap: 18px;
        }

        .client-card:hover {
            border-color: var(--brand);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .client-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--radius);
            background: var(--brand-light);
            color: var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .client-info { flex: 1; }

        .client-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 2px;
        }

        .client-website {
            font-size: 12px;
            color: var(--brand);
            margin-bottom: 10px;
        }

        .client-doc-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .doc-tag {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 8px;
            border-radius: 4px;
            background: var(--bg);
            color: var(--text-muted);
            border: 1px solid var(--border-light);
        }

        .client-arrow {
            color: var(--text-muted);
            font-size: 18px;
            margin-top: 12px;
            transition: all 0.2s ease;
        }

        .client-card:hover .client-arrow {
            color: var(--brand);
            transform: translateX(4px);
        }

        /* ── CLIENT DETAIL PAGE ── */
        .client-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 36px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .client-header-avatar {
            width: 56px;
            height: 56px;
            border-radius: var(--radius);
            background: var(--brand-light);
            color: var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
        }

        .client-header-info h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        .client-header-info p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ── DOCUMENT SECTIONS ── */
        .doc-section {
            margin-bottom: 36px;
        }

        .doc-section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-light);
        }

        .doc-section-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
        }

        .doc-section-icon.generated {
            background: var(--brand-light);
            color: var(--brand);
        }

        .doc-section-icon.signed {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .doc-section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .doc-section-count {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--bg);
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: auto;
        }

        /* ── DOCUMENT TABLE ── */
        .doc-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .doc-table thead {
            background: var(--bg);
        }

        .doc-table th {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            padding: 10px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .doc-table td {
            padding: 14px 16px;
            font-size: 13px;
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
        }

        .doc-table tbody tr:last-child td { border-bottom: none; }

        .doc-table tbody tr {
            transition: background 0.15s ease;
        }

        .doc-table tbody tr:hover {
            background: var(--brand-lighter);
        }

        .doc-type-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .doc-type-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-invoice { background: var(--brand); }
        .dot-agreement { background: #5C6BC0; }
        .dot-certificate { background: #26A69A; }

        .doc-ref {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-light);
        }

        .doc-filename {
            font-size: 12px;
            color: var(--text-muted);
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .doc-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid var(--border);
            background: var(--bg-white);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--brand);
            color: var(--brand);
            background: var(--brand-lighter);
        }

        .btn-primary {
            background: var(--brand);
            color: white;
            border-color: var(--brand);
        }

        .btn-primary:hover {
            background: var(--brand-dark);
            border-color: var(--brand-dark);
            color: white;
        }

        .btn-green {
            background: #E8F5E9;
            color: #2E7D32;
            border-color: #C8E6C9;
        }

        .btn-green:hover {
            background: #C8E6C9;
            border-color: #A5D6A7;
            color: #1B5E20;
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ── FOOTER ── */
        .footer {
            text-align: center;
            padding: 24px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-light);
            margin-top: 60px;
        }

        .footer a {
            color: var(--brand);
            text-decoration: none;
        }

        /* ── RESPONSIVE: TABLET ── */
        @media (max-width: 768px) {
            .navbar { padding: 0 16px; height: 54px; }
            .navbar-logo { font-size: 17px; }
            .navbar-title { font-size: 12px; }
            .navbar-meta { display: none; }
            .breadcrumb { padding: 8px 16px; font-size: 12px; }
            .main { padding: 28px 16px 60px; }
            .home-header { margin-bottom: 32px; }
            .home-header h1 { font-size: 24px; }
            .client-grid { grid-template-columns: 1fr; }
            .client-header { gap: 14px; margin-bottom: 28px; padding-bottom: 18px; }
            .client-header-avatar { width: 44px; height: 44px; font-size: 18px; }
            .client-header-info h2 { font-size: 18px; }
            .doc-filename { display: none; }
            .doc-table th:nth-child(3),
            .doc-table td:nth-child(3) { display: none; }
        }

        /* ── RESPONSIVE: MOBILE ── */
        @media (max-width: 480px) {
            .navbar { padding: 0 12px; height: 50px; }
            .navbar-logo { font-size: 15px; }
            .navbar-divider { height: 18px; }
            .navbar-title { font-size: 11px; }
            .main { padding: 20px 12px 50px; }
            .home-header { margin-bottom: 24px; }
            .home-header h1 { font-size: 20px; }
            .home-header p { font-size: 12px; }
            .stats-bar { gap: 16px; }
            .stat-value { font-size: 22px; }
            .stat-label { font-size: 10px; }
            .client-card { padding: 16px; gap: 12px; }
            .client-avatar { width: 40px; height: 40px; font-size: 16px; }
            .client-name { font-size: 14px; }
            .client-arrow { display: none; }
            .client-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .client-header-info h2 { font-size: 17px; }
            .client-header-info p { font-size: 12px; }
            .doc-section-header { gap: 8px; }
            .doc-section-icon { width: 28px; height: 28px; font-size: 12px; }
            .doc-section-title { font-size: 13px; }

            /* Convert table to stacked cards on mobile */
            .doc-table { border: none; background: none; }
            .doc-table thead { display: none; }
            .doc-table tbody { display: flex; flex-direction: column; gap: 10px; }
            .doc-table tbody tr {
                display: flex;
                flex-direction: column;
                background: var(--bg-white);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 14px;
                gap: 8px;
            }
            .doc-table tbody tr:hover {
                border-color: var(--brand);
            }
            .doc-table td {
                padding: 0;
                border-bottom: none;
            }
            .doc-table td:nth-child(3) { display: none; }
            .doc-type-badge { font-size: 13px; }
            .doc-ref { font-size: 11px; }
            .doc-actions {
                justify-content: stretch;
                gap: 8px;
            }
            .doc-actions .btn {
                flex: 1;
                justify-content: center;
                padding: 10px 12px;
                font-size: 12px;
            }
            .btn { min-height: 40px; }
            .footer { font-size: 10px; padding: 16px 12px; margin-top: 40px; }
        }

        /* ── PRINT ── */
        @media print {
            .navbar, .breadcrumb, .footer, .btn { display: none !important; }
            .main { padding: 0; max-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a class="navbar-brand" onclick="navigate('')">
            <span class="navbar-logo">A Generative Slice</span>
            <div class="navbar-divider"></div>
            <span class="navbar-title">Document Central</span>
        </a>
        <span class="navbar-meta" id="navbar-meta"></span>
    </nav>

    <!-- BREADCRUMB -->
    <div class="breadcrumb" id="breadcrumb"></div>

    <!-- MAIN CONTENT -->
    <div class="main">

        <!-- HOME PAGE -->
        <div class="page active" id="page-home">
            <div class="home-header">
                <h1>Document Central</h1>
                <p>Professional client documentation &amp; records</p>
                <div class="stats-bar" id="stats-bar"></div>
            </div>
            <div class="section-label">Clients</div>
            <div class="client-grid" id="client-grid"></div>
        </div>

        <!-- CLIENT DETAIL PAGE -->
        <div class="page" id="page-client">
            <div class="client-header" id="client-header"></div>
            <div id="client-sections"></div>
        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        <a href="mailto:agenerativeslice@gmail.com">A Generative Slice</a> &middot; Document Central
    </div>

    <script>
    /* ═════════════════════════════════════════════
       CLIENT DATABASE — Add new clients here.
       Each client entry follows this structure.
       ═════════════════════════════════════════════ */

    const DATABASE = {
        "nas-design-construction": {
            name: "NAS Design & Construction",
            website: "nasdesignconstruction.com",
            status: "Active",
            generated: [
                {
                    title: "Website Maintenance & Management Agreement",
                    type: "agreement",
                    ref: "SLA-2026-001",
                    file: "clients/nas-design-construction/generated/Maintenance_Agreement_SLA-2026-001.html"
                },
                {
                    title: "Invoice",
                    type: "invoice",
                    ref: "INV-1001",
                    file: "clients/nas-design-construction/generated/Invoice_INV-1001.html"
                },
                {
                    title: "Project Acceptance & Sign-Off Certificate",
                    type: "certificate",
                    ref: "CERT-2026-001",
                    file: "clients/nas-design-construction/generated/Project_SignOff_CERT-2026-001.html"
                }
            ],
            signed: [
                {
                    title: "Website Maintenance & Management Agreement",
                    type: "agreement",
                    ref: "SLA-2026-001",
                    file: "clients/nas-design-construction/signed/Maintenance_Agreement_SLA-2026-001_SIGNED.pdf"
                },
                {
                    title: "Invoice",
                    type: "invoice",
                    ref: "INV-1001",
                    file: "clients/nas-design-construction/signed/Invoice_INV-1001_SIGNED.pdf"
                },
                {
                    title: "Project Acceptance & Sign-Off Certificate",
                    type: "certificate",
                    ref: "CERT-2026-001",
                    file: "clients/nas-design-construction/signed/Project_SignOff_CERT-2026-001_SIGNED.pdf"
                }
            ]
        }
    };

    /* ═════════════════════════════════════════════
       RENDERING ENGINE
       ═════════════════════════════════════════════ */

    const clientKeys = Object.keys(DATABASE);

    function getInitials(name) {
        return name.split(/[\s&]+/).filter(w => w.length > 1).map(w => w[0]).join('').toUpperCase().slice(0, 2);
    }

    function getDocDot(type) {
        const map = { invoice: 'dot-invoice', agreement: 'dot-agreement', certificate: 'dot-certificate' };
        return map[type] || '';
    }

    function getDocLabel(type) {
        const map = { invoice: 'Invoice', agreement: 'Agreement', certificate: 'Certificate' };
        return map[type] || 'Document';
    }

    function getFilename(filepath) {
        return filepath.split('/').pop();
    }

    // ── Stats Bar ──
    function renderStats() {
        let totalDocs = 0;
        let totalSigned = 0;
        clientKeys.forEach(k => {
            totalDocs += DATABASE[k].generated.length;
            totalSigned += DATABASE[k].signed.length;
        });
        document.getElementById('stats-bar').innerHTML = `
            <div class="stat"><div class="stat-value">${clientKeys.length}</div><div class="stat-label">Clients</div></div>
            <div class="stat"><div class="stat-value">${totalDocs}</div><div class="stat-label">Documents</div></div>
            <div class="stat"><div class="stat-value">${totalSigned}</div><div class="stat-label">Signed PDFs</div></div>
        `;
    }

    // ── Client Grid ──
    function renderClientGrid() {
        const grid = document.getElementById('client-grid');
        grid.innerHTML = clientKeys.map(key => {
            const c = DATABASE[key];
            const tags = c.generated.map(d => `<span class="doc-tag">${d.ref}</span>`).join('');
            return `
                <div class="client-card" onclick="navigate('${key}')">
                    <div class="client-avatar">${getInitials(c.name)}</div>
                    <div class="client-info">
                        <div class="client-name">${c.name}</div>
                        <div class="client-website">${c.website}</div>
                        <div class="client-doc-tags">${tags}</div>
                    </div>
                    <div class="client-arrow">→</div>
                </div>
            `;
        }).join('');
    }

    // ── Document Table ──
    function renderDocTable(docs, type) {
        if (!docs || docs.length === 0) {
            return '<div class="empty-state">No documents found.</div>';
        }

        const isGenerated = type === 'generated';
        const rows = docs.map(doc => {
            const filename = getFilename(doc.file);
            const isPDF = doc.file.endsWith('.pdf');
            const openLabel = isPDF ? 'View PDF' : 'View';
            const printBtn = isPDF
                ? `<a href="${doc.file}" download class="btn btn-green">↓ Download</a>`
                : `<a href="${doc.file}" target="_blank" class="btn" onclick="event.stopPropagation()">⎙ Print</a>`;

            return `
                <tr>
                    <td>
                        <div class="doc-type-badge">
                            <div class="doc-type-dot ${getDocDot(doc.type)}"></div>
                            ${doc.title}
                        </div>
                    </td>
                    <td><span class="doc-ref">${doc.ref}</span></td>
                    <td class="doc-filename">${filename}</td>
                    <td>
                        <div class="doc-actions">
                            <a href="${doc.file}" target="_blank" class="btn btn-primary">${openLabel}</a>
                            ${printBtn}
                        </div>
                    </td>
                </tr>
            `;
        }).join('');

        return `
            <table class="doc-table">
                <thead>
                    <tr>
                        <th>Document</th>
                        <th>Reference</th>
                        <th>Filename</th>
                        <th style="text-align:right;">Actions</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        `;
    }

    // ── Client Detail Page ──
    function renderClientPage(key) {
        const c = DATABASE[key];
        if (!c) return;

        document.getElementById('client-header').innerHTML = `
            <div class="client-header-avatar">${getInitials(c.name)}</div>
            <div class="client-header-info">
                <h2>${c.name}</h2>
                <p>${c.website} &middot; ${c.status} &middot; ${c.generated.length + c.signed.length} documents</p>
            </div>
        `;

        document.getElementById('client-sections').innerHTML = `
            <div class="doc-section">
                <div class="doc-section-header">
                    <div class="doc-section-icon generated">📄</div>
                    <div class="doc-section-title">Unsigned Documents</div>
                    <div class="doc-section-count">${c.generated.length}</div>
                </div>
                ${renderDocTable(c.generated, 'generated')}
            </div>
            <div class="doc-section">
                <div class="doc-section-header">
                    <div class="doc-section-icon signed">✓</div>
                    <div class="doc-section-title">Signed Documents</div>
                    <div class="doc-section-count">${c.signed.length}</div>
                </div>
                ${renderDocTable(c.signed, 'signed')}
            </div>
        `;
    }

    /* ═════════════════════════════════════════════
       HASH ROUTER
       ═════════════════════════════════════════════ */

    function navigate(clientKey) {
        window.location.hash = clientKey ? `#/${clientKey}` : '#/';
    }

    function route() {
        const hash = window.location.hash.replace('#/', '').replace('#', '');
        const pageHome = document.getElementById('page-home');
        const pageClient = document.getElementById('page-client');
        const breadcrumb = document.getElementById('breadcrumb');

        if (hash && DATABASE[hash]) {
            // Client detail view
            pageHome.classList.remove('active');
            pageClient.classList.add('active');
            breadcrumb.classList.add('visible');
            breadcrumb.innerHTML = `<a onclick="navigate('')">Clients</a> &nbsp;/&nbsp; <span>${DATABASE[hash].name}</span>`;
            renderClientPage(hash);
            document.title = `${DATABASE[hash].name} — Document Central`;
        } else {
            // Home view
            pageHome.classList.add('active');
            pageClient.classList.remove('active');
            breadcrumb.classList.remove('visible');
            document.title = 'Document Central — A Generative Slice';
        }
    }

    /* ═════════════════════════════════════════════
       INIT
       ═════════════════════════════════════════════ */

    function init() {
        renderStats();
        renderClientGrid();
        route();

        const totalDocs = clientKeys.reduce((sum, k) =>
            sum + DATABASE[k].generated.length + DATABASE[k].signed.length, 0);
        document.getElementById('navbar-meta').textContent =
            `${clientKeys.length} client${clientKeys.length !== 1 ? 's' : ''} · ${totalDocs} documents`;
    }

    window.addEventListener('hashchange', route);
    window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
